[package]
name = "shao"
version = "0.1.7"
edition = "2021"
authors = ["Adiel Tan <adieltan@users.noreply.github.com>"]
description = "Shao (哨兵) - Ultra-lightweight, single-binary Linux server telemetry & monitoring sentinel in Rust"
license = "Apache-2.0"
repository = "https://github.com/adieltan/shao"
readme = "README.md"
keywords = ["monitoring", "server", "telemetry", "rapl", "dashboard"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Client for Immich / External APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# System Telemetry & Embedded Database
sysinfo = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }

# Embedded Frontend Assets
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
incremental = true
strip = true

[profile.dev]
opt-level = 0
incremental = true
